<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | NetiShield</title><link rel="stylesheet" href="style.css"><script src="config.js"></script></head><body><header class="nav"><a class="logo" href="index.html"><span>N</span>NetiShield <em>ADMIN</em></a><nav><a href="index.html">مشاهده سایت</a></nav></header><main class="container admin">
<section id="login" class="login"><small>SECURE ADMIN</small><h1>ورود به پنل مدیریت</h1><p>GitHub Fine-grained Token را وارد کنید. توکن ذخیره نمی‌شود.</p><input id="token" type="password" placeholder="github_pat_..."><button id="loginBtn" class="btn">ورود</button><div id="loginMsg"></div></section>
<section id="dash" hidden><div class="dashhead"><div><small>CONTROL CENTER</small><h1>پنل مدیریت NetiShield</h1></div><button id="logout" class="btn secondary">خروج</button></div><div class="stats"><div><b id="statArticles">0</b><span>مقاله</span></div><div><b id="statCats">0</b><span>دسته</span></div><div><b id="statLinks">0</b><span>لینک</span></div></div>
<div class="tabs"><button data-tab="articles" class="selected">مقالات</button><button data-tab="categories">دسته‌ها</button><button data-tab="links">لینک‌ها</button><button data-tab="settings">تنظیمات</button></div>
<div id="tab-articles" class="panel"><div class="heading"><h2>مدیریت مقالات</h2><button class="btn" id="newArticle">+ مقاله جدید</button></div><div class="editor"><div class="two"><input id="title" placeholder="عنوان"><input id="slug" placeholder="slug یکتا"></div><div class="two"><input id="category" placeholder="دسته‌بندی"><input id="tags" placeholder="تگ‌ها با کاما"></div><input id="cover" placeholder="URL تصویر کاور"><input id="excerpt" placeholder="خلاصه"><div class="mdgrid"><textarea id="content" placeholder="Markdown مقاله..."></textarea><div id="preview" class="preview"></div></div><label><input id="featured" type="checkbox"> مقاله ویژه</label><div class="actions"><button class="btn" id="saveArticle">ذخیره و انتشار</button><button class="btn secondary" id="cancelEdit">لغو</button></div><div id="status"></div></div><input id="adminSearch" placeholder="جستجوی مقاله..."><div id="adminArticles"></div></div>
<div id="tab-categories" class="panel" hidden><h2>دسته‌بندی‌ها</h2><div class="inline"><input id="newCat" placeholder="دسته جدید"><button class="btn" id="addCat">افزودن</button></div><div id="catList"></div></div>
<div id="tab-links" class="panel" hidden><h2>لینک‌ها</h2><div class="two"><input id="linkTitle" placeholder="عنوان لینک"><input id="linkUrl" placeholder="https://..."></div><input id="linkDesc" placeholder="توضیح"><button class="btn" id="addLink">افزودن لینک</button><div id="linkListAdmin"></div></div>
<div id="tab-settings" class="panel" hidden><h2>تنظیمات سایت</h2><input id="setTitle" placeholder="عنوان"><input id="setHero" placeholder="عنوان اصلی"><textarea id="setText" placeholder="متن اصلی"></textarea><textarea id="setAbout" placeholder="درباره"></textarea><textarea id="setContact" placeholder="تماس"></textarea><button class="btn" id="saveSettings">ذخیره تنظیمات</button></div>
</section></main><footer>© NetiShield</footer><script src="admin.js"></script></body></html>
